# docker-compose.yml

version: '3.8'

services:
  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_REMOTE_DOCKER=false
      - AWS_DEFAULT_REGION=us-east-1
      #- COGNITO_IDP_URL=http://localhost:9229 localstack start
      - SERVICES=s3,lambda,apigateway,sqs  #cognitoidp,sqs  #cognitoidentity,
      - DATA_DIR=/tmp/localstack-d
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/tmp/localstack-d"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-scripts:/docker-entrypoint-initaws.d"
    networks:
      - app-network
  cognito-local:
    image: jagregory/cognito-local
    ports:
      - "9229:9229"
    environment:
      - USER_POOL_ID=${USER_POOL_ID}
      - CLIENT_ID=${CLIENT_ID}
      - COGNITO_USER_POOL_ID=${USER_POOL_ID}
      - COGNITO_CLIENT_ID=${CLIENT_ID}
    volumes:
      - cognito-data:/home/cognitovolum/.cognito-local
      - ./init-scripts:/init-cognito.sh
    networks:
      - app-network
  postgres:
    container_name: postgres
    image: postgres:14.5-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app-network
  api:
    container_name: go-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - COGNITO_IDP_URL=http://localhost:9229
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=appdb
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - COGNITO_USER_POOL_ID=${USER_POOL_ID}
      - COGNITO_CLIENT_ID=${CLIENT_ID}
    depends_on:
      - localstack
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  cognito-data:
  postgres-data: